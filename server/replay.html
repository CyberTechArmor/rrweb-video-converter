<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=__WIDTH__, initial-scale=1.0" />
  <title>rrweb Replay</title>

  <script>
    // Override document visibility BEFORE any other script so rrweb's
    // requestAnimationFrame-based playback isn't throttled to 1Hz by
    // headless Chromium's default 'hidden' visibility state.
    (function () {
      try {
        Object.defineProperty(document, "hidden", {
          configurable: true,
          get: function () { return false; },
        });
        Object.defineProperty(document, "visibilityState", {
          configurable: true,
          get: function () { return "visible"; },
        });
        Object.defineProperty(document, "webkitHidden", {
          configurable: true,
          get: function () { return false; },
        });
        Object.defineProperty(document, "webkitVisibilityState", {
          configurable: true,
          get: function () { return "visible"; },
        });
      } catch (e) {
        console.warn("visibility override failed:", e);
      }
    })();
  </script>

  <style>
/* __RRWEB_CSS__ */
  </style>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: __WIDTH__px;
      height: __HEIGHT__px;
      overflow: hidden;
      background: #fff;
    }
    #player-container {
      width: __WIDTH__px;
      height: __HEIGHT__px;
      position: relative;
      overflow: hidden;
    }
    .replay-done {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="player-container"></div>
  <div id="done-marker"></div>

  <script>
/* __RRWEB_JS__ */
  </script>
  <script>
    // Events and speed are inlined as JSON literals. htmlSafeJson in the
    // worker escapes <, >, &, U+2028/U+2029 so this is safe inside a
    // <script> tag regardless of event content.
    window.__EVENTS_DATA__ = /* __EVENTS_JSON__ */ null;
    window.__REPLAY_SPEED__ = __SPEED__;
  </script>
  <script>
    (function () {
      window.__REPLAY_READY__ = false;
      window.__REPLAY_DONE__ = false;
      window.__REPLAY_ERROR__ = null;
      window.__REPLAY_LOG__ = [];
      window.__REPLAY_CURRENT_MS__ = 0;
      window.__REPLAY_TOTAL_MS__ = 0;

      function log(msg) {
        window.__REPLAY_LOG__.push(msg);
        try { console.log("[replay] " + msg); } catch (e) {}
      }

      function setDoneMarker(text) {
        var marker = document.getElementById("done-marker");
        if (marker) {
          marker.className = "replay-done";
          marker.textContent = text;
        }
      }

      // Surface uncaught parse/runtime errors so the worker sees them
      window.addEventListener("error", function (e) {
        var msg = "window.error: " + (e.message || "unknown") +
                  (e.filename ? " @ " + e.filename + ":" + e.lineno : "");
        log(msg);
        if (!window.__REPLAY_ERROR__) window.__REPLAY_ERROR__ = msg;
        setDoneMarker("error");
      });

      try {
        log("init script start");

        var events = window.__EVENTS_DATA__;
        var speed = window.__REPLAY_SPEED__;

        if (!events || !events.length) {
          throw new Error(
            "events missing or empty (type: " + typeof events + ")"
          );
        }
        log("events count: " + events.length);
        log("speed: " + speed);
        log("visibilityState: " + document.visibilityState);

        if (typeof rrweb === "undefined") {
          throw new Error(
            "rrweb global is undefined (UMD bundle did not load or failed to parse)"
          );
        }
        if (!rrweb.Replayer) {
          throw new Error(
            "rrweb.Replayer is undefined (keys: " +
              Object.keys(rrweb).join(",") +
              ")"
          );
        }
        log("rrweb loaded, keys: " + Object.keys(rrweb).join(","));

        var replayer = new rrweb.Replayer(events, {
          root: document.getElementById("player-container"),
          speed: speed,
          skipInactive: false,
          showWarning: false,
          showDebug: false,
          mouseTail: {
            duration: 500,
            lineCap: "round",
            lineWidth: 3,
            strokeStyle: "red",
          },
          UNSAFE_replayCanvas: true,
        });

        window.__REPLAYER__ = replayer;

        try {
          var meta = replayer.getMetaData();
          window.__REPLAY_TOTAL_MS__ =
            (meta && meta.totalTime) ||
            events[events.length - 1].timestamp - events[0].timestamp;
        } catch (e) {
          window.__REPLAY_TOTAL_MS__ =
            events[events.length - 1].timestamp - events[0].timestamp;
        }
        log("replay total ms: " + window.__REPLAY_TOTAL_MS__);

        replayer.on("finish", function () {
          log("replay finish event");
          window.__REPLAY_DONE__ = true;
          setDoneMarker("done");
        });

        replayer.play(0);

        // Fallback: rrweb's finish event occasionally misses. Poll
        // getCurrentTime() and flip __REPLAY_DONE__ ourselves once
        // we've reached the end.
        var fallbackInterval = setInterval(function () {
          try {
            if (window.__REPLAY_DONE__) {
              clearInterval(fallbackInterval);
              return;
            }
            var cur =
              typeof replayer.getCurrentTime === "function"
                ? replayer.getCurrentTime()
                : 0;
            window.__REPLAY_CURRENT_MS__ = cur;
            if (cur >= window.__REPLAY_TOTAL_MS__ + 500) {
              log(
                "fallback: reached end of replay (" +
                  cur +
                  "/" +
                  window.__REPLAY_TOTAL_MS__ +
                  ")"
              );
              window.__REPLAY_DONE__ = true;
              setDoneMarker("done");
              clearInterval(fallbackInterval);
            }
          } catch (e) {
            log("fallback poll error: " + (e && e.message));
          }
        }, 200);

        window.__REPLAY_READY__ = true;
        log("replayer ready and playing");
      } catch (err) {
        var msg = (err && err.message) || String(err);
        log("INIT ERROR: " + msg);
        try { console.error("rrweb init failed:", err); } catch (e) {}
        window.__REPLAY_ERROR__ = msg;
        setDoneMarker("error");
      }
    })();
  </script>
</body>
</html>
