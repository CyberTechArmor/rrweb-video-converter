<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=__WIDTH__, initial-scale=1.0" />
  <title>rrweb Replay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: __WIDTH__px;
      height: __HEIGHT__px;
      overflow: hidden;
      background: #fff;
    }
    #player-container {
      width: __WIDTH__px;
      height: __HEIGHT__px;
      position: relative;
      overflow: hidden;
    }
    #player-container .replayer-wrapper {
      transform-origin: top left;
    }
    .replay-done {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    /* __RRWEB_CSS__ */
  </style>
</head>
<body>
  <div id="player-container"></div>
  <div id="done-marker"></div>

  <script>
    // __RRWEB_JS__
  </script>
  <script>
    (function () {
      const events = __EVENTS_PLACEHOLDER__;
      const speed = __SPEED__;
      const targetWidth = __WIDTH__;
      const targetHeight = __HEIGHT__;

      window.__REPLAY_READY__ = false;
      window.__REPLAY_DONE__ = false;
      window.__REPLAY_ERROR__ = null;

      function setDoneMarker(text) {
        const marker = document.getElementById("done-marker");
        marker.className = "replay-done";
        marker.textContent = text;
      }

      try {
        if (typeof rrweb === "undefined" || !rrweb.Replayer) {
          throw new Error("rrweb library did not load");
        }

        const replayer = new rrweb.Replayer(events, {
          root: document.getElementById("player-container"),
          speed: speed,
          skipInactive: false,
          showWarning: false,
          showDebug: false,
          mouseTail: {
            duration: 500,
            lineCap: "round",
            lineWidth: 3,
            strokeStyle: "red",
          },
          UNSAFE_replayCanvas: true,
        });

        // Scale the replay content to fill the target viewport
        // Meta gives us the original recorded resolution
        try {
          const meta = replayer.getMetaData();
          const origWidth = meta.totalTime ? (replayer.iframe && replayer.iframe.offsetWidth) : 0;
          // Leave default scaling; rrweb sizes the iframe to the recorded document
        } catch (e) {
          // ignore
        }

        replayer.on("finish", function () {
          window.__REPLAY_DONE__ = true;
          setDoneMarker("done");
          console.log("Replay finished");
        });

        // Start playback
        replayer.play(0);
        window.__REPLAY_READY__ = true;
        console.log("Replayer initialized, playing " + events.length + " events at " + speed + "x");
      } catch (err) {
        console.error("rrweb init failed:", err);
        window.__REPLAY_ERROR__ = err.message || String(err);
        setDoneMarker("error");
      }
    })();
  </script>
</body>
</html>
