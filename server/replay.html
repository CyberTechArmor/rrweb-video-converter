<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=__WIDTH__, initial-scale=1.0" />
  <title>rrweb Replay</title>
  <link rel="stylesheet" href="__RRWEB_CSS_URL__" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: __WIDTH__px;
      height: __HEIGHT__px;
      overflow: hidden;
      background: #fff;
    }
    #player-container {
      width: __WIDTH__px;
      height: __HEIGHT__px;
      position: relative;
      overflow: hidden;
    }
    .replay-done {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="player-container"></div>
  <div id="done-marker"></div>

  <script src="__RRWEB_JS_URL__"></script>
  <script>
    (function () {
      const events = __EVENTS_PLACEHOLDER__;
      const speed = __SPEED__;

      window.__REPLAY_READY__ = false;
      window.__REPLAY_DONE__ = false;
      window.__REPLAY_ERROR__ = null;
      window.__REPLAY_LOG__ = [];

      function log(msg) {
        window.__REPLAY_LOG__.push(msg);
        console.log("[replay] " + msg);
      }

      function setDoneMarker(text) {
        const marker = document.getElementById("done-marker");
        marker.className = "replay-done";
        marker.textContent = text;
      }

      try {
        log("script start");
        if (typeof rrweb === "undefined") {
          throw new Error("rrweb global is undefined (UMD bundle did not load)");
        }
        if (!rrweb.Replayer) {
          throw new Error(
            "rrweb.Replayer is undefined (available keys: " +
              Object.keys(rrweb).join(", ") +
              ")"
          );
        }
        log("rrweb loaded, keys: " + Object.keys(rrweb).join(","));
        log("events count: " + (events && events.length));

        const replayer = new rrweb.Replayer(events, {
          root: document.getElementById("player-container"),
          speed: speed,
          skipInactive: false,
          showWarning: false,
          showDebug: false,
          mouseTail: {
            duration: 500,
            lineCap: "round",
            lineWidth: 3,
            strokeStyle: "red",
          },
          UNSAFE_replayCanvas: true,
        });

        replayer.on("finish", function () {
          log("replay finish event");
          window.__REPLAY_DONE__ = true;
          setDoneMarker("done");
        });

        replayer.play(0);
        window.__REPLAY_READY__ = true;
        log("replayer ready and playing");
      } catch (err) {
        const msg = (err && err.message) || String(err);
        log("ERROR: " + msg);
        console.error("rrweb init failed:", err);
        window.__REPLAY_ERROR__ = msg;
        setDoneMarker("error");
      }
    })();
  </script>
</body>
</html>
